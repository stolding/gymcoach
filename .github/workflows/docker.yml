# Bouwt het Docker-image (amd64 en arm64) en zet het op GitHub Container Registry:
#   ghcr.io/<eigenaar>/gymcoach:latest  en  :<versie uit package.json>
name: Docker-image
on:
  push:
    branches: [main]
    paths-ignore: ['ios/**', 'documentatie/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax en meertaligheid controleren
        run: |
          for f in server.js lib/*.js public/*.js public/locales/*.js tools/*.mjs; do node --check "$f"; done
          node tools/i18n-check.mjs
      - name: Versie en naam
        id: meta
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.title=GymCoach
            org.opencontainers.image.description=Trainingscoach voor de Speediance Gym Monster
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Rooktest
        run: |
          docker run -d --name gc -p 8765:8765 ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/api/auth/status && exit 0; sleep 2; done
          docker logs gc; exit 1
