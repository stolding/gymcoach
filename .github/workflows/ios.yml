# Bouwt de iPhone-app "GymCoach Sync" op een Mac van GitHub (geen eigen Mac nodig).
# - Elke push naar ios/: controle-build voor de simulator (zonder ondertekenen).
# - Handmatig (Actions → iOS-app → Run workflow → TestFlight aan) of een tag ios-v… of een commit met [testflight] in de tekst: ondertekenen en uploaden naar TestFlight.
#   Nodig als repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (inhoud van AuthKey_xxx.p8).
name: iOS-app
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
    tags: ['ios-v*']   # tag ios-v… = ondertekenen en naar TestFlight
  workflow_dispatch:
    inputs:
      testflight:
        description: 'Ondertekenen en naar TestFlight uploaden'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen
        run: |
          # Apple accepteert alleen builds met de iOS 26 SDK (Xcode 26 of nieuwer)
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Geen Xcode 26 op deze runner. Aanwezig: $(ls /Applications | grep Xcode | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: Build voor de simulator
        run: |
          xcodebuild -project GymCoachSync.xcodeproj -scheme GymCoachSync \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

  testflight:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.testflight) || startsWith(github.ref, 'refs/tags/ios-v') || contains(github.event.head_commit.message, '[testflight]')
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 26 kiezen
        run: |
          # Apple accepteert alleen builds met de iOS 26 SDK (Xcode 26 of nieuwer)
          X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -z "$X" ] && X=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error::Geen Xcode 26 op deze runner. Aanwezig: $(ls /Applications | grep Xcode | tr '\n' ' ')"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"
      - name: XcodeGen
        run: brew install xcodegen && xcodegen generate
      - name: App Store Connect-sleutel
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$TEAM_ID" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" && test -n "$ASC_KEY_P8" || { echo "::error::Secrets ontbreken (APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8)"; exit 1; }
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Oude CI-certificaten intrekken
        working-directory: ${{ github.workspace }}
        env:
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: python3 .github/scripts/revoke-ci-certs.py
      - name: Archief maken (ondertekend)
        run: |
          set +e
          xcodebuild -project GymCoachSync.xcodeproj -scheme GymCoachSync \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymCoachSync.xcarchive" archive \
            DEVELOPMENT_TEAM="$TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > archive.log 2>&1
          code=$?
          tail -40 archive.log
          # foutregels als annotaties, zodat ze in het overzicht van de run staan
          if [ $code -ne 0 ]; then grep -E "error:|error |No profiles|provisioning|signing|Signing|denied|Authentication|not found|Could not" archive.log | sort -u | head -15 | sed 's/^/::error::/'; exit $code; fi
      - name: Uploaden naar TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          set +e
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GymCoachSync.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > export.log 2>&1
          code=$?
          tail -40 export.log
          if [ $code -ne 0 ]; then grep -E "error:|error |rror|denied|Authentication|not found|Could not|already" export.log | sort -u | head -15 | sed 's/^/::error::/'; exit $code; fi
