# XcodeGen-projectbeschrijving: "xcodegen generate" maakt hieruit GymCoachSync.xcodeproj (geen Mac nodig om te bewerken).
name: GymCoachSync
options:
  bundleIdPrefix: com.stolding
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.14.0"
    CURRENT_PROJECT_VERSION: "29"
targets:
  GymCoachSync:
    type: application
    platform: iOS
    sources:
      - GymCoachSync
    dependencies:
      - target: GymCoachWidgets
        embed: true
    entitlements:
      path: GymCoachSync/GymCoachSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.security.application-groups:
          - group.com.stolding.gymcoachsync
    info:
      path: GymCoachSync/Info.plist
      properties:
        CFBundleDisplayName: GymCoach Sync
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHealthShareUsageDescription: GymCoach Sync leest je workouts (wandelen, fietsen enz.) met hartslag, en dagwaarden voor stappen, actieve energie, afstand, hartslag in rust, hartslagvariabiliteit (HRV), VO2max en voeding (calorieën, eiwit, koolhydraten, vet en vezels), en stuurt die naar je eigen GymCoach-server.
        NSHealthUpdateUsageDescription: GymCoach Sync schrijft niets naar Apple Health.
        NSLocalNetworkUsageDescription: Om je GymCoach-server in je thuisnetwerk te bereiken.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stolding.gymcoachsync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # iPhone-app: niet aanbieden op de Mac of op de Vision Pro
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  GymCoachWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GymCoachWidgets
    entitlements:
      path: GymCoachWidgets/GymCoachWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.stolding.gymcoachsync
    info:
      path: GymCoachWidgets/Info.plist
      properties:
        CFBundleDisplayName: GymCoach
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stolding.gymcoachsync.widgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
